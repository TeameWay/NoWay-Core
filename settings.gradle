pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// 项目名与产物名统一按 mod_name-neoforge-version 命名
rootProject.name = "${mod_name}-neoforge-${mod_version}"
